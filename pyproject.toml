[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I", "PL", "RUF"]
ignore = [
  "E501",     # long lines: readability over wrapping
  "PLR0912",  # too many branches
  "PLR0913",  # too many arguments
  "PLR0915",  # too many statements
  "PLR0917",  # too many positional arguments
  "PLR2004",  # magic values
  "PLW0603",  # global statement (CLI region switch)
  "PLC0415",  # import inside function (lazy cryptography import)
  "RUF001",   # ambiguous unicode (· in messages)
]
